<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bundestagsdebatten – Verkehrsträger im Wandel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg:      #f5f1eb;
    --surface: #edeae3;
    --border:  #d6d1c8;
    --text:    #1e1b17;
    --muted:   #8a837a;
    --luft:    #4a87b0;
    --schiene: #b56830;
    --schiff:  #3d9070;
    --strasse: #a88e28;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 300;
    line-height: 1.6;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 3rem 4rem 2.5rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 2rem;
    background: var(--bg);
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 3vw, 2.8rem);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  header p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-align: right;
    max-width: 320px;
    line-height: 1.8;
  }

  .legend {
    display: flex;
    gap: 2rem;
    padding: 1rem 4rem;
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 1px 0 var(--border);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.2s;
    user-select: none;
  }
  .legend-item.active { opacity: 1; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .timeline { padding: 0 4rem 6rem; }

  .year-block {
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 80px 1fr;
  }

  .year-label {
    padding: 2rem 1.5rem 2rem 0;
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--muted);
    border-right: 1px solid var(--border);
    position: sticky;
    top: 40px;
    align-self: start;
  }

  .year-entries {
    padding: 1.2rem 0 1.2rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  .entry {
    display: flex;
    flex-direction: column;
    gap: 0;
    transition: opacity 0.3s;
  }
  .entry.hidden { display: none; }

  .entry-main {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 0;
    align-items: start;
  }

  .traeger-col {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    padding-top: 0.15rem;
  }

  .traeger-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.2rem 0.5rem;
    border-radius: 3px;
    font-weight: 500;
    white-space: nowrap;
    width: fit-content;
  }
  .traeger-tag.Luft    { color: var(--luft);    border: 1px solid var(--luft);    background: rgba(74,135,176,0.08); }
  .traeger-tag.Schiene { color: var(--schiene); border: 1px solid var(--schiene); background: rgba(181,104,48,0.08); }
  .traeger-tag.Schiff  { color: var(--schiff);  border: 1px solid var(--schiff);  background: rgba(61,144,112,0.08); }
  .traeger-tag.Straße  { color: var(--strasse); border: 1px solid var(--strasse); background: rgba(168,142,40,0.08); }

  /* Word-share mini bar below tag */
  .ws-mini {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  .ws-mini-track {
    width: 54px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .ws-mini-fill { height: 100%; border-radius: 2px; }
  .ws-mini-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  .entry-right { display: flex; flex-direction: column; gap: 0.35rem; }

  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    align-items: center;
  }

  .topic-pill {
    font-size: 0.78rem;
    padding: 0.15rem 0.55rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    line-height: 1.5;
    color: var(--text);
  }
  .topic-pill.primary {
    font-weight: 500;
    font-size: 0.82rem;
    background: transparent;
  }
  .topic-pill.primary.Luft    { border-color: rgba(74,135,176,0.5);  color: var(--luft); }
  .topic-pill.primary.Schiene { border-color: rgba(181,104,48,0.5);  color: var(--schiene); }
  .topic-pill.primary.Schiff  { border-color: rgba(61,144,112,0.5);  color: var(--schiff); }
  .topic-pill.primary.Straße  { border-color: rgba(168,142,40,0.5);  color: var(--strasse); }

  /* Source toggle */
  .source-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.1rem 0;
    transition: color 0.15s;
    width: fit-content;
  }
  .source-toggle:hover { color: var(--text); }
  .source-toggle svg { transition: transform 0.2s; flex-shrink: 0; }
  .source-toggle.open svg { transform: rotate(90deg); }
  .source-toggle.open { color: var(--text); }

  /* Source panel */
  .source-panel {
    display: none;
    margin-top: 0.4rem;
    padding: 0.75rem 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    line-height: 1.9;
  }
  .source-panel.open { display: block; }

  .source-row { display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap; }
  .source-label {
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #aaa09a;
    white-space: nowrap;
    min-width: 60px;
  }
  .source-words { color: #7a7570; }

  .source-words .hw {
    padding: 0.05rem 0.3rem;
    border-radius: 2px;
    margin: 0 1px;
    font-weight: 500;
  }
  .hw.Luft    { color: var(--luft);    background: rgba(74,135,176,0.12); }
  .hw.Schiene { color: var(--schiene); background: rgba(181,104,48,0.12); }
  .hw.Schiff  { color: var(--schiff);  background: rgba(61,144,112,0.12); }
  .hw.Straße  { color: var(--strasse); background: rgba(168,142,40,0.12); }

  .source-divider { border: none; border-top: 1px solid var(--border); margin: 0.4rem 0; }

  .word-share-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.3rem;
  }
  .ws-label { font-size: 0.55rem; color: #aaa09a; text-transform: uppercase; letter-spacing: 0.08em; }
  .ws-track {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    max-width: 140px;
  }
  .ws-fill { height: 100%; border-radius: 2px; }
  .ws-value { font-size: 0.6rem; color: var(--muted); }

  .no-topic { font-size: 0.78rem; color: var(--muted); font-style: italic; }

  @media (max-width: 700px) {
    header { padding: 2rem 1.5rem 1.5rem; flex-direction: column; align-items: flex-start; }
    header p { text-align: left; max-width: 100%; }
    .legend { padding: 0.75rem 1.5rem; flex-wrap: wrap; gap: 1rem; top: 0; }
    .timeline { padding: 0 1.5rem 4rem; }
    .year-label { font-size: 1.1rem; top: 36px; }
    .entry-main { grid-template-columns: 80px 1fr; }
  }

  /* Klickbare Wort-Chips */
  .word-chip {
    display: inline-block;
    padding: 0.05rem 0.3rem;
    border-radius: 2px;
    margin: 0 1px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, outline 0.15s;
    outline: 1px solid transparent;
  }
  .word-chip:hover { opacity: 0.75; outline-color: currentColor; }
  .word-chip.active-chip { outline: 1px solid currentColor; opacity: 1; }

  .word-chip.Luft    { color: var(--luft);    background: rgba(74,135,176,0.12); }
  .word-chip.Schiene { color: var(--schiene); background: rgba(181,104,48,0.12); }
  .word-chip.Schiff  { color: var(--schiff);  background: rgba(61,144,112,0.12); }
  .word-chip.Straße  { color: var(--strasse); background: rgba(168,142,40,0.12); }
  .word-chip.plain   { color: #8a837a;        background: rgba(0,0,0,0.05); }

  /* Inline-Diagramm */
  .word-chart-container {
    display: none;
    margin-top: 0.5rem;
    padding: 0.75rem 0.75rem 0.5rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .word-chart-container.open { display: block; }

  .chart-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
    letter-spacing: 0.05em;
  }
  .chart-title span { font-weight: 500; color: var(--text); }

  canvas.word-chart { width: 100% !important; height: 90px !important; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

const YEARS = Array.from({length: 34}, (_, i) => String(1991 + i));

let activeChart = null;

function getWordCounts(word) {
  const w = word.toLowerCase().trim();
  const counts = WORD_COUNTS[w] || {};
  return YEARS.map(y => counts[y] || 0);
}

function closeActiveChart() {
  if (!activeChart) return;
  activeChart.chipEl.classList.remove('active-chip');
  activeChart.containerEl.classList.remove('open');
  if (activeChart.chartInstance) activeChart.chartInstance.destroy();
  activeChart.containerEl.innerHTML = '';
  activeChart = null;
}

function openWordChart(word, chipEl, containerEl, traeger) {
  if (activeChart && activeChart.chipEl === chipEl) {
    closeActiveChart();
    return;
  }
  closeActiveChart();

  const counts = getWordCounts(word);
  const total = counts.reduce((a, b) => a + b, 0);

  containerEl.innerHTML = `
    <div class="chart-title">Nennungen von <span>"${word}"</span> im Zeitverlauf (${total} gesamt)</div>
    <canvas class="word-chart"></canvas>
  `;
  containerEl.classList.add('open');
  chipEl.classList.add('active-chip');

  const color = colorMap[traeger] || '#888';
  const ctx = containerEl.querySelector('canvas').getContext('2d');
  const chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: YEARS,
      datasets: [{
        data: counts,
        backgroundColor: color + '44',
        borderColor: color,
        borderWidth: 1,
        borderRadius: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#fff',
          titleColor: '#666',
          bodyColor: '#1e1b17',
          borderColor: '#d6d1c8',
          borderWidth: 1,
          callbacks: {
            title: items => items[0].label,
            label: item => `${item.raw} Nennungen`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#aaa09a', font: { family: 'IBM Plex Mono', size: 9 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 },

        y: {

          grid: { color: 'rgba(0,0,0,0.05)' },
          border: { color: 'var(--border)' }
        }
      }
    }
  });
  activeChart = { chipEl, containerEl, chartInstance };
}

function buildWordChips(wordStr, isTfidf, traeger, tfidfSet) {
  if (!wordStr) return '—';
  return wordStr.split(',').map(w => {
    const wt = w.trim();
    const wl = wt.toLowerCase();
    let cls;
    if (isTfidf) {
      cls = GENERIC_WORDS.has(wl) ? 'plain' : traeger;
    } else {
      cls = (!GENERIC_WORDS.has(wl) && tfidfSet.has(wl)) ? traeger : 'plain';
    }
    return `<span class="word-chip ${cls}" data-word="${wt}" data-traeger="${traeger}">${wt}</span>`;
  }).join(' ');
}

const colorMap = { Luft: '#4a87b0', Schiene: '#b56830', Schiff: '#3d9070', 'Straße': '#a88e28' };

// Einträge nach Jahrgang gruppieren
const byYear = {};
raw.forEach(d => {
  const [year, traeger, freqWords, tfidfWords, wordShare, topics] = d;
  if (!byYear[year]) byYear[year] = [];
  byYear[year].push({ traeger, freqWords, tfidfWords, wordShare, topics });
});

// Innerhalb jedes Jahres nach Wortanteil absteigend sortieren
Object.values(byYear).forEach(entries => {
  entries.sort((a, b) => (b.wordShare ?? 0) - (a.wordShare ?? 0));
});

const years = Object.keys(byYear).sort((a, b) => b - a);
const timeline = document.getElementById('timeline');

years.forEach(year => {
  const block = document.createElement('div');
  block.className = 'year-block';

  const label = document.createElement('div');
  label.className = 'year-label';
  label.textContent = year;

  const entries = document.createElement('div');
  entries.className = 'year-entries';

  byYear[year].forEach(item => {
    const hasTopics = item.topics && item.topics.length > 0;
    const hasWords = item.freqWords || item.tfidfWords;
    if (!hasTopics && !hasWords) return;

    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.dataset.traeger = item.traeger;

    const entryMain = document.createElement('div');
    entryMain.className = 'entry-main';

    // Linke Spalte: Tag + Mini-Wortanteilsbalken
    const traegerCol = document.createElement('div');
    traegerCol.className = 'traeger-col';

    const tag = document.createElement('div');
    tag.className = `traeger-tag ${item.traeger}`;
    tag.textContent = item.traeger.toUpperCase();
    traegerCol.appendChild(tag);

    if (item.wordShare) {
      const wsMini = document.createElement('div');
      wsMini.className = 'ws-mini';

      const wsTrack = document.createElement('div');
      wsTrack.className = 'ws-mini-track';
      const wsFill = document.createElement('div');
      wsFill.className = 'ws-mini-fill';
      wsFill.style.width = `${Math.min(item.wordShare / 50 * 100, 100)}%`;
      wsFill.style.background = colorMap[item.traeger];
      wsTrack.appendChild(wsFill);

      const wsLbl = document.createElement('span');
      wsLbl.className = 'ws-mini-label';
      wsLbl.textContent = `${item.wordShare} %`;

      wsMini.appendChild(wsTrack);
      wsMini.appendChild(wsLbl);
      traegerCol.appendChild(wsMini);
    }

    const right = document.createElement('div');
    right.className = 'entry-right';

    if (hasTopics) {
      const topicsDiv = document.createElement('div');
      topicsDiv.className = 'topics';
      item.topics.forEach((t, i) => {
        const pill = document.createElement('span');
        pill.className = `topic-pill${i === 0 ? ' primary ' + item.traeger : ''}`;
        pill.textContent = t;
        topicsDiv.appendChild(pill);
      });
      right.appendChild(topicsDiv);
    } else {
      const none = document.createElement('span');
      none.className = 'no-topic';
      none.textContent = 'Thema nicht eindeutig bestimmbar';
      right.appendChild(none);
    }

    if (hasWords) {
      const tfidfSet = item.tfidfWords
        ? new Set(item.tfidfWords.split(',').map(w => w.trim().toLowerCase()))
        : new Set();

      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'source-toggle';
      toggleBtn.innerHTML = `
        <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
          <path d="M2 1L6 4L2 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Quellwörter`;

      const sourcePanel = document.createElement('div');
      sourcePanel.className = 'source-panel';

      const chartContainer = document.createElement('div');
      chartContainer.className = 'word-chart-container';

      let panelHTML = '';
      if (item.freqWords) {
        panelHTML += `<div class="source-row"><span class="source-label">H\u00e4ufig</span><span class="source-words">${buildWordChips(item.freqWords, false, item.traeger, tfidfSet)}</span></div>`;
      }
      if (item.freqWords && item.tfidfWords) panelHTML += '<hr class="source-divider">';
      if (item.tfidfWords) {
        panelHTML += `<div class="source-row"><span class="source-label">TF-IDF</span><span class="source-words">${buildWordChips(item.tfidfWords, true, item.traeger, tfidfSet)}</span></div>`;
      }
      if (item.wordShare) {
        const c = colorMap[item.traeger];
        panelHTML += `
          <hr class="source-divider">
          <div class="word-share-bar">
            <span class="ws-label">Wortanteil</span>
            <div class="ws-track">
              <div class="ws-fill" style="width:${Math.min(item.wordShare / 50 * 100, 100)}%; background:${c}"></div>
            </div>
            <span class="ws-value">${item.wordShare} %</span>
          </div>`;
      }
      sourcePanel.innerHTML = panelHTML;
      sourcePanel.appendChild(chartContainer);

      sourcePanel.addEventListener('click', e => {
        const chip = e.target.closest('.word-chip');
        if (!chip) return;
        openWordChart(chip.dataset.word, chip, chartContainer, chip.dataset.traeger);
      });

      toggleBtn.addEventListener('click', () => {
        const open = sourcePanel.classList.toggle('open');
        toggleBtn.classList.toggle('open', open);
        if (!open) closeActiveChart();
      });

      right.appendChild(toggleBtn);
      right.appendChild(sourcePanel);
    }

    entryMain.appendChild(traegerCol);
    entryMain.appendChild(right);
    entry.appendChild(entryMain);
    entries.appendChild(entry);
  });

  block.appendChild(label);
  block.appendChild(entries);
  timeline.appendChild(block);
});

// Filterlogik
const activeFilters = new Set(['Luft', 'Schiene', 'Schiff', 'Straße']);
document.getElementById('legend').addEventListener('click', e => {
  const item = e.target.closest('.legend-item');
  if (!item) return;
  const f = item.dataset.filter;
  if (activeFilters.has(f)) {
    if (activeFilters.size === 1) return;
    activeFilters.delete(f);
    item.classList.remove('active');
  } else {
    activeFilters.add(f);
    item.classList.add('active');
  }
  document.querySelectorAll('.entry').forEach(el => {
    el.classList.toggle('hidden', !activeFilters.has(el.dataset.traeger));
  });
});
