<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bundestagsdebatten – Verkehrsträger im Wandel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --border: #2a2a2a;
    --text: #e8e4dc;
    --muted: #7a7570;
    --luft: #6ba3c4;
    --schiene: #c97e4a;
    --schiff: #5ea88a;
    --strasse: #c4a84a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 300;
    line-height: 1.6;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 3rem 4rem 2.5rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 2rem;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 3vw, 2.8rem);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.02em;
  }

  header p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    text-align: right;
    max-width: 320px;
    line-height: 1.8;
  }

  .legend {
    display: flex;
    gap: 2rem;
    padding: 1rem 4rem;
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.2s;
    user-select: none;
  }
  .legend-item.active { opacity: 1; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .timeline { padding: 0 4rem 6rem; }

  .year-block {
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 80px 1fr;
  }

  .year-label {
    padding: 2rem 1.5rem 2rem 0;
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--muted);
    border-right: 1px solid var(--border);
    position: sticky;
    top: 0;
    align-self: start;
  }

  .year-entries {
    padding: 1.2rem 0 1.2rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .entry {
    display: flex;
    flex-direction: column;
    gap: 0;
    transition: opacity 0.3s;
  }
  .entry.hidden { display: none; }

  .entry-main {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 0;
    align-items: start;
  }

  .traeger-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.63rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.2rem 0.5rem;
    border-radius: 2px;
    font-weight: 500;
    white-space: nowrap;
    margin-top: 0.2rem;
    width: fit-content;
  }
  .traeger-tag.Luft    { color: var(--luft);    border: 1px solid var(--luft);    background: rgba(107,163,196,0.06); }
  .traeger-tag.Schiene { color: var(--schiene);  border: 1px solid var(--schiene);  background: rgba(201,126,74,0.06); }
  .traeger-tag.Schiff  { color: var(--schiff);   border: 1px solid var(--schiff);   background: rgba(94,168,138,0.06); }
  .traeger-tag.Straße  { color: var(--strasse);  border: 1px solid var(--strasse);  background: rgba(196,168,74,0.06); }

  .entry-right { display: flex; flex-direction: column; gap: 0.35rem; }

  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    align-items: center;
  }

  .topic-pill {
    font-size: 0.8rem;
    padding: 0.15rem 0.55rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    line-height: 1.5;
  }
  .topic-pill.primary { font-weight: 500; font-size: 0.85rem; background: transparent; }
  .topic-pill.primary.Luft    { border-color: rgba(107,163,196,0.4); color: var(--luft); }
  .topic-pill.primary.Schiene { border-color: rgba(201,126,74,0.4);  color: var(--schiene); }
  .topic-pill.primary.Schiff  { border-color: rgba(94,168,138,0.4);  color: var(--schiff); }
  .topic-pill.primary.Straße  { border-color: rgba(196,168,74,0.4);  color: var(--strasse); }

  /* Source toggle button */
  .source-toggle {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.1rem 0;
    transition: color 0.15s;
    width: fit-content;
  }
  .source-toggle:hover { color: var(--text); }
  .source-toggle svg {
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .source-toggle.open svg { transform: rotate(90deg); }
  .source-toggle.open { color: var(--text); }

  /* Source panel */
  .source-panel {
    display: none;
    margin-top: 0.4rem;
    padding: 0.75rem 1rem;
    background: #111;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    line-height: 1.9;
  }
  .source-panel.open { display: block; }

  .source-row { display: flex; gap: 0.6rem; align-items: baseline; flex-wrap: wrap; }
  .source-label {
    font-size: 0.58rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #444;
    white-space: nowrap;
    min-width: 60px;
  }
  .source-words { color: #9a9590; }

  .source-words .hw {
    padding: 0.05rem 0.3rem;
    border-radius: 2px;
    margin: 0 1px;
    font-weight: 500;
  }
  .hw.Luft    { color: var(--luft);    background: rgba(107,163,196,0.1); }
  .hw.Schiene { color: var(--schiene); background: rgba(201,126,74,0.1); }
  .hw.Schiff  { color: var(--schiff);  background: rgba(94,168,138,0.1); }
  .hw.Straße  { color: var(--strasse); background: rgba(196,168,74,0.1); }

  .source-divider { border: none; border-top: 1px solid #222; margin: 0.4rem 0; }

  .word-share-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.3rem;
  }
  .ws-label { font-size: 0.58rem; color: #444; text-transform: uppercase; letter-spacing: 0.08em; }
  .ws-track {
    flex: 1;
    height: 3px;
    background: #222;
    border-radius: 2px;
    max-width: 120px;
  }
  .ws-fill { height: 100%; border-radius: 2px; }
  .ws-value { font-size: 0.62rem; color: #555; }

  .no-topic { font-size: 0.78rem; color: var(--muted); font-style: italic; }

  @media (max-width: 700px) {
    header { padding: 2rem 1.5rem 1.5rem; flex-direction: column; align-items: flex-start; }
    header p { text-align: left; max-width: 100%; }
    .legend { padding: 1rem 1.5rem; flex-wrap: wrap; gap: 1rem; }
    .timeline { padding: 0 1.5rem 4rem; }
    .year-label { font-size: 1.1rem; }
    .entry-main { grid-template-columns: 70px 1fr; }
  }
</style>
</head>

// Highlight words that are particularly distinctive (appear in top_words / TF-IDF column)
// We mark TF-IDF words as "highlighted" since they're more distinctive than freq words
function buildSourceHTML(freqWords, tfidfWords, traeger) {
  if (!freqWords && !tfidfWords) return null;

  const tfidfSet = tfidfWords ? new Set(tfidfWords.split(',').map(w => w.trim().toLowerCase())) : new Set();

  const renderWords = (wordStr, isTfidf) => {
    if (!wordStr) return '—';
    return wordStr.split(',').map(w => {
      const wt = w.trim();
      if (isTfidf) {
        return `<span class="hw ${traeger}">${wt}</span>`;
      }
      // For freq words, highlight if also in tfidf
      if (tfidfSet.has(wt.toLowerCase())) {
        return `<span class="hw ${traeger}">${wt}</span>`;
      }
      return wt;
    }).join(', ');
  };

  return `
    <div class="source-row">
      <span class="source-label">Häufig</span>
      <span class="source-words">${renderWords(freqWords, false)}</span>
    </div>
    <hr class="source-divider">
    <div class="source-row">
      <span class="source-label">TF-IDF</span>
      <span class="source-words">${renderWords(tfidfWords, true)}</span>
    </div>
  `;
}

// Group by year
const byYear = {};
raw.forEach(d => {
  const [year, traeger, freqWords, tfidfWords, wordShare, topics] = d;
  if (!byYear[year]) byYear[year] = [];
  byYear[year].push({ traeger, freqWords, tfidfWords, wordShare, topics });
});

const years = Object.keys(byYear).sort((a,b) => b - a);
const timeline = document.getElementById('timeline');

const colorMap = { Luft: '#6ba3c4', Schiene: '#c97e4a', Schiff: '#5ea88a', 'Straße': '#c4a84a' };

years.forEach(year => {
  const block = document.createElement('div');
  block.className = 'year-block';

  const label = document.createElement('div');
  label.className = 'year-label';
  label.textContent = year;

  const entries = document.createElement('div');
  entries.className = 'year-entries';

  byYear[year].forEach(item => {
    // Skip entries with no data at all
    const hasTopics = item.topics && item.topics.length > 0;
    const hasWords = item.freqWords || item.tfidfWords;
    if (!hasTopics && !hasWords) return;

    const entry = document.createElement('div');
    entry.className = 'entry';
    entry.dataset.traeger = item.traeger;

    const entryMain = document.createElement('div');
    entryMain.className = 'entry-main';

    const tag = document.createElement('div');
    tag.className = `traeger-tag ${item.traeger}`;
    tag.textContent = item.traeger.toUpperCase();

    const right = document.createElement('div');
    right.className = 'entry-right';

    // Topics
    if (hasTopics) {
      const topicsDiv = document.createElement('div');
      topicsDiv.className = 'topics';
      item.topics.forEach((t, i) => {
        const pill = document.createElement('span');
        pill.className = `topic-pill${i === 0 ? ' primary ' + item.traeger : ''}`;
        pill.textContent = t;
        topicsDiv.appendChild(pill);
      });
      right.appendChild(topicsDiv);
    } else {
      const none = document.createElement('span');
      none.className = 'no-topic';
      none.textContent = 'Thema nicht eindeutig bestimmbar';
      right.appendChild(none);
    }

    // Source toggle
    if (hasWords) {
      const sourceHTML = buildSourceHTML(item.freqWords, item.tfidfWords, item.traeger);
      if (sourceHTML) {
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'source-toggle';
        toggleBtn.innerHTML = `
          <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
            <path d="M2 1L6 4L2 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Quellwörter`;
        if (item.wordShare) {
          toggleBtn.innerHTML += `&nbsp;<span style="color:#333;font-weight:300">${item.wordShare}% Wortanteil</span>`;
        }

        const sourcePanel = document.createElement('div');
        sourcePanel.className = 'source-panel';
        sourcePanel.innerHTML = sourceHTML;

        // Add word-share bar
        if (item.wordShare) {
          const barHTML = `
            <hr class="source-divider">
            <div class="word-share-bar">
              <span class="ws-label">Wortanteil</span>
              <div class="ws-track">
                <div class="ws-fill" style="width:${Math.min(item.wordShare/50*100,100)}%; background:${colorMap[item.traeger]}60"></div>
              </div>
              <span class="ws-value">${item.wordShare}%</span>
            </div>`;
          sourcePanel.innerHTML += barHTML;
        }

        toggleBtn.addEventListener('click', () => {
          const open = sourcePanel.classList.toggle('open');
          toggleBtn.classList.toggle('open', open);
        });

        right.appendChild(toggleBtn);
        right.appendChild(sourcePanel);
      }
    }

    entryMain.appendChild(tag);
    entryMain.appendChild(right);
    entry.appendChild(entryMain);
    entries.appendChild(entry);
  });

  block.appendChild(label);
  block.appendChild(entries);
  timeline.appendChild(block);
});

// Filter logic
const activeFilters = new Set(['Luft', 'Schiene', 'Schiff', 'Straße']);
document.getElementById('legend').addEventListener('click', e => {
  const item = e.target.closest('.legend-item');
  if (!item) return;
  const f = item.dataset.filter;
  if (activeFilters.has(f)) {
    if (activeFilters.size === 1) return;
    activeFilters.delete(f);
    item.classList.remove('active');
  } else {
    activeFilters.add(f);
    item.classList.add('active');
  }
  document.querySelectorAll('.entry').forEach(el => {
    el.classList.toggle('hidden', !activeFilters.has(el.dataset.traeger));
  });
});
</script>
